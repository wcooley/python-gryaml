[tox]
envlist = cov-init, 3.12-py2neo_2021, cov-report
tox_pip_extensions_ext_venv_update = true
minversion = 4.0
requires =
    tox >= 4

[testenv]
package = editable
passenv =
    NEO4J_URI
    COVERAGE_*
    PIP_*
    PYTHON*
setenv =
    COVERAGE_FILE = .coverage.{envname}
    NEO4J_URI = {env:NEO4J_URI:http://localhost:7474/db/data/}
    PY2NEO_COMPAT = {env:PY2NEO_COMPAT:-e../python-py2neo_compat}
deps =
    {env:PY2NEO_COMPAT}
    py2neo2021: py2neo ~= 2021.2.4
extras =
    test
    py2neo_2021: py2neo2021
allowlist_externals =
commands_pre =
commands =
    pytest \
        --basetemp={envtmpdir} \
        --cov \
        --cov-config={toxinidir}/.coveragerc \
        --cov-report=term \
        --junit-xml={toxinidir}/junit-{envname}.xml \
        --junit-prefix={envname} \
        {posargs}

[testenv:cov-init]
skip_install = True
setenv =
    COVERAGE_FILE = .coverage
deps = coverage
commands =
    coverage erase

[testenv:cov-report]
ignore_outcome = True
skip_install = True
setenv =
    COVERAGE_FILE = .coverage
deps = coverage
commands =
    - coverage combine
    coverage report
    coverage html
