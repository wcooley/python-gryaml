[build-system]
requires = [
    "setuptools",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[project]
name = "gryaml"
authors = [{name = "Wil Cooley", email = "wcooley@nakedape.cc"}]
license = {text = "MIT"}
description = "Represent Neo4j graph data as YAML."
dynamic = ["version"]
requires-python = ">= 3.12"
keywords = ["yaml", "py2neo", "neo4j", "gryaml"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
#    "Programming Language :: Python :: 3.13",
#    "Programming Language :: Python :: 3.14",
]
urls = {Homepage = "https://github.com/wcooley/python-gryaml"}
dependencies = [
    "boltons",
    "py2neo",
    "py2neo_compat~=2.0.0rc0",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
]
py2neo2021 = [
    "py2neo~=2021.2.4"
]

[project.scripts]
gryaml-load = "gryaml.__main__:__main__"

[tool.setuptools]
package-dir = {"" = "src"}
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["gryaml"]
namespaces = false

[tool.setuptools_scm]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
